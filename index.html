<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<title>Telinhas</title>
<style>
*{box-sizing:border-box;margin:0}
:root{--ac:#64d2ff;--tx:#f5f7fb;--mut:#9aa6b8;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.11);--r:30px}
body.warm{--ac:#ffb340}
html,body{height:100%}
body{color:var(--tx);font:16px/1.4 -apple-system,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;overflow:hidden;transition:filter .5s;-webkit-font-smoothing:antialiased;
background:radial-gradient(60% 50% at 12% 8%,#1f3f9466,transparent),radial-gradient(50% 50% at 92% 18%,#6b2fc05a,transparent),radial-gradient(70% 60% at 60% 105%,#0b708f55,transparent),#070a12}
body.night{filter:brightness(.55) saturate(.8)}
svg{display:block}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto auto;gap:14px;padding:max(14px,env(safe-area-inset-top)) 22px max(14px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:19px;letter-spacing:-.2px}
.logo svg{width:30px;height:30px}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:#30d158;box-shadow:0 0 10px #30d158}
.off .dot{background:#ff453a;box-shadow:0 0 10px #ff453a}
.slow .dot{background:#ffd60a;box-shadow:0 0 10px #ffd60a}
button,select,input[type=text]{font:inherit;color:var(--tx);background:rgba(255,255,255,.12);border:0;border-radius:16px;padding:9px 16px;transition:background .2s,transform .15s}
button{cursor:pointer}
button:hover{background:rgba(255,255,255,.2)}
button:active{transform:scale(.96)}
select option{color:#000}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.stage{min-height:0}
.view{display:none;height:100%;overflow:auto}
.view.on{display:block;animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.995)}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(130px,1fr);gap:16px;height:100%}
.w,.pane{background:var(--glass);backdrop-filter:blur(40px) saturate(170%);-webkit-backdrop-filter:blur(40px) saturate(170%);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 40px #0004,inset 0 1px 0 #ffffff14}
.w{padding:20px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .25s,background .25s}
.w[data-go],.w.tap{cursor:pointer}
.w[data-go]:hover,.w.tap:hover{background:rgba(255,255,255,.11);transform:translateY(-2px)}
.w h3{font-size:14px;font-weight:500;color:var(--mut)}
.big{font-size:clamp(46px,8.5vw,128px);font-weight:100;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.big i{font-style:normal;font-size:.32em;font-weight:300;color:var(--ac);margin-left:.15em;letter-spacing:0}
.big.sm{font-size:clamp(28px,3.4vw,46px);font-weight:200;letter-spacing:-.01em}
.hi{font-size:clamp(18px,2vw,26px);font-weight:500;margin-bottom:6px}
.w2{grid-column:span 2;grid-row:span 2}
.w-cam{padding:0;background:#000}
video{width:100%;height:100%;object-fit:cover;border-radius:inherit;opacity:0;transition:opacity .5s}
.camon video{opacity:1}
.ph{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;color:var(--mut);background:linear-gradient(160deg,#18233c,#0d1220);transition:opacity .5s}
.ph svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.camon .ph{opacity:0;pointer-events:none}
.over{position:absolute;inset:auto 0 0 0;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(transparent,#000a)}
.live{display:none;align-items:center;gap:7px;font-size:14px}
.camon .live{display:flex}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#ff453a;box-shadow:0 0 8px #ff453a}
.pane{padding:24px;height:100%;display:flex;flex-direction:column;gap:16px;overflow:auto}
.pane .big{font-size:clamp(64px,15vw,230px)}
.world{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.world div{background:rgba(255,255,255,.07);border-radius:22px;padding:14px 16px}
.world b{display:block;font-size:28px;font-weight:200;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pane video{flex:1;min-height:0;background:#000;border-radius:22px}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
#log div{max-width:75%;padding:10px 16px;border-radius:22px;background:rgba(255,255,255,.12)}
#log .me{align-self:flex-end;background:var(--ac);color:#04202b}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{background:transparent;border:1px solid var(--line);font-size:14px;color:var(--mut)}
#ask{display:flex;gap:8px}
#q{flex:1}
#nl{display:flex;flex-direction:column;gap:8px;overflow:auto}
#nl a{color:var(--tx);text-decoration:none;background:rgba(255,255,255,.07);padding:14px 18px;border-radius:22px;display:flex;justify-content:space-between;gap:16px;transition:background .2s}
#nl a:hover{background:rgba(255,255,255,.13)}
#nl small{color:var(--mut);white-space:nowrap}
.set{max-width:620px;width:100%;margin:auto;background:rgba(255,255,255,.06);border-radius:24px;overflow:hidden}
.set label{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line)}
.set label:last-child{border:0}
.set input[type=text]{width:55%;background:rgba(255,255,255,.08)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:99px;background:rgba(255,255,255,.2);position:relative;cursor:pointer;transition:background .25s;flex:none}
input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0005;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
input[type=checkbox]:checked{background:#30d158}
input[type=checkbox]:checked::after{transform:translateX(20px)}
.tick{overflow:hidden;white-space:nowrap;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:8px 0;color:var(--mut);font-size:14px}
.tick span{display:inline-block;padding-left:100%;animation:run 120s linear infinite}
@keyframes run{to{transform:translateX(-100%)}}
.dock{justify-self:center;display:flex;gap:6px;padding:8px;border-radius:30px;background:rgba(255,255,255,.09);backdrop-filter:blur(40px) saturate(170%);-webkit-backdrop-filter:blur(40px) saturate(170%);border:1px solid var(--line);transition:opacity .5s,transform .5s}
.dock button{display:grid;justify-items:center;gap:3px;background:transparent;padding:8px 16px;border-radius:22px;color:var(--mut);font-size:12px;min-width:76px}
.dock button.on{background:rgba(255,255,255,.17);color:var(--tx)}
.dock svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dock button.on svg{stroke:var(--ac)}
.idle{cursor:none}
.idle .dock{opacity:0;transform:translateY(24px)}
#toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-90px);padding:10px 20px;border-radius:99px;background:rgba(40,46,60,.85);backdrop-filter:blur(30px);border:1px solid var(--line);transition:transform .45s cubic-bezier(.2,1.2,.4,1);z-index:5}
#toast.on{transform:translate(-50%,0)}
#boot{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#070a12;animation:bo .8s 1.4s forwards}
#boot div{display:flex;flex-direction:column;align-items:center;gap:16px;font-size:36px;font-weight:600;letter-spacing:-.5px;animation:bi 1.1s cubic-bezier(.2,.8,.2,1) both}
#boot svg{width:92px;height:92px}
@keyframes bi{from{opacity:0;transform:scale(.88);filter:blur(10px)}}
@keyframes bo{to{opacity:0;visibility:hidden}}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);height:auto}.dock button{min-width:0;padding:8px 10px}}
@media(prefers-reduced-motion:reduce){#boot{display:none}.tick span{animation:none;padding-left:14px}.view.on{animation:none}}
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true">
<symbol id="logo" viewBox="0 0 32 32"><rect x="3" y="6" width="26" height="18" rx="6" fill="none" stroke-width="2" style="stroke:var(--ac)"/><path d="M11 28h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="15" r="3" style="fill:var(--ac)"/></symbol>
<symbol id="i0" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="i1" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i2" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></symbol>
<symbol id="i3" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
<symbol id="i4" viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></symbol>
<symbol id="i5" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></symbol>
</svg>
<div id="boot"><div><svg><use href="#logo"/></svg>Telinhas</div></div>
<div id="toast" role="status"></div>
<div class="app">
  <header class="top">
    <div class="logo"><svg><use href="#logo"/></svg>Telinhas</div>
    <span class="sp"></span>
    <span class="pill" id="net"><i class="dot"></i><span id="nt">Verificando…</span></span>
    <span class="pill" id="bat" hidden></span>
    <span class="pill" id="mini"></span>
    <button id="fs">Tela cheia</button>
  </header>

  <main class="stage">
    <section class="view on"><div class="grid">
      <article class="w w2" data-go="1" tabindex="0"><div><p class="hi" id="hi"></p><h3 id="cn"></h3></div><div><div class="big" id="c1"></div><p class="mut" id="d1"></p></div></article>
      <article class="w w2 w-cam" data-go="2" tabindex="0"><video muted playsinline></video><div class="ph"><svg><use href="#i2"/></svg>Câmera do quarto</div><div class="over"><span class="live">Ao vivo</span><button class="camtog">Ligar câmera</button></div></article>
      <article class="w" data-go="3" tabindex="0"><h3>Assistente</h3><p>Pergunte as horas, abra a câmera ou peça as notícias.</p></article>
      <article class="w" data-go="4" tabindex="0"><h3>Notícias</h3><p id="nw">Carregando…</p></article>
      <article class="w tap" id="wn" tabindex="0"><h3>Internet</h3><div><div class="big sm" id="ms">--</div><p class="mut" id="nq">Toque para testar</p></div></article>
      <article class="w"><h3>Tempo de voo</h3><div class="big sm" id="fl">--:--:--</div><button id="fb">Decolar</button></article>
    </div></section>

    <section class="view"><div class="pane">
      <h3 class="mut" id="cn2"></h3><div class="big" id="c2"></div><p class="mut" id="d2"></p>
      <div class="world" id="world"></div>
    </div></section>

    <section class="view"><div class="pane">
      <div class="w-cam" id="camv" style="display:contents"><video muted playsinline></video></div>
      <div class="bar"><button class="camtog">Ligar câmera</button><select id="camsel" aria-label="Escolher câmera"></select><span class="mut" id="cs">Câmera desligada</span></div>
    </div></section>

    <section class="view"><div class="pane">
      <div id="log" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <form id="ask"><input type="text" id="q" placeholder="Digite um comando…" autocomplete="off"><button type="button" id="mic">Falar</button><button>Enviar</button></form>
    </div></section>

    <section class="view"><div class="pane">
      <div class="bar"><button id="nr">Atualizar</button><span class="mut" id="ns"></span></div>
      <div id="nl"></div>
    </div></section>

    <section class="view"><div class="pane"><div class="set">
      <label>Fuso horário<select id="tzs"></select></label>
      <label>Relógio de 24 horas<input type="checkbox" data-s="h24"></label>
      <label>Modo noite<input type="checkbox" data-s="night"></label>
      <label>Cor quente<input type="checkbox" data-s="warm"></label>
      <label>Notícias na barra<input type="checkbox" data-s="ticker"></label>
      <label>Assistente fala as respostas<input type="checkbox" data-s="voice"></label>
      <label>Feed de notícias (RSS)<input type="text" id="rss"></label>
    </div></div></section>
  </main>

  <div class="tick" id="tkw"><span id="tk"></span></div>
  <nav class="dock" id="dock" aria-label="Telas"></nav>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const KEY='telinhas',RSS0='https://g1.globo.com/rss/g1/';
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}
const S=Object.assign({tz:'America/Sao_Paulo',h24:true,voice:false,rss:RSS0,night:false,warm:false,ticker:true,start:0,cam:''},saved);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)}

/* ---------- Telas e atalhos ---------- */
const names=['Início','Relógio','Câmera','Assistente','Notícias','Ajustes'],views=$$('.view'),dock=$('#dock');let cur=0;
names.forEach((n,i)=>{const b=document.createElement('button');b.innerHTML='<svg><use href="#i'+i+'"/></svg><span>'+n+'</span>';b.onclick=()=>go(i);dock.append(b)});
function go(i){
  cur=(i+names.length)%names.length;
  views.forEach((v,k)=>v.classList.toggle('on',k===cur));
  [...dock.children].forEach((b,k)=>b.classList.toggle('on',k===cur));
  if(cur===3)$('#q').focus();
}
const fs=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
$('#fs').onclick=fs;
addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key>='1'&&e.key<='6')go(e.key-1);
  else if(e.key==='ArrowRight')go(cur+1);
  else if(e.key==='ArrowLeft')go(cur-1);
  else if(e.key==='f'||e.key==='F')fs();
  else if(e.key==='Enter'&&e.target.dataset.go)go(+e.target.dataset.go);
  else if(e.key==='Enter'&&e.target.id==='wn')ping();
});
document.addEventListener('click',e=>{const w=e.target.closest('[data-go]');if(w&&!e.target.closest('button'))go(+w.dataset.go)});
let gp=[];setInterval(()=>{
  const p=(navigator.getGamepads?navigator.getGamepads():[])[0];if(!p)return;
  const d=p.buttons.map(b=>b.pressed);
  [[4,-1],[14,-1],[5,1],[15,1]].forEach(([k,s])=>{if(d[k]&&!gp[k])go(cur+s)});
  if(d[3]&&!gp[3])fs();gp=d;
},80);
/* tela cheia: some o dock depois de 5 s parado e a tela não apaga */
let it,wl;
function wake(){document.body.classList.remove('idle');clearTimeout(it);if(document.fullscreenElement)it=setTimeout(()=>document.body.classList.add('idle'),5000)}
['mousemove','keydown','pointerdown'].forEach(ev=>addEventListener(ev,wake));
document.addEventListener('fullscreenchange',async()=>{wake();try{if(document.fullscreenElement&&navigator.wakeLock)wl=await navigator.wakeLock.request('screen');else wl?.release()}catch{}});

/* ---------- Relógio ---------- */
const zones=[['Brasília','America/Sao_Paulo'],['UTC','UTC'],['Lisboa','Europe/Lisbon'],['Nova York','America/New_York'],['Tóquio','Asia/Tokyo']];
const tzName=()=>(zones.find(z=>z[1]===S.tz)||[S.tz])[0];
const fmt=(tz,o)=>new Intl.DateTimeFormat('pt-BR',{...(o.hour?{hour12:!S.h24}:{}),timeZone:tz,...o});
const HM={hour:'2-digit',minute:'2-digit'};
zones.forEach(z=>{$('#tzs').add(new Option(z[0],z[1]));const d=document.createElement('div');d.innerHTML='<span class="mut">'+z[0]+'</span><b data-tz="'+z[1]+'"></b>';$('#world').append(d)});
function tick(){
  const n=new Date(),hm=fmt(S.tz,HM).format(n),sc=fmt(S.tz,{second:'2-digit'}).format(n),d=fmt(S.tz,{dateStyle:'full'}).format(n);
  const h=+new Intl.DateTimeFormat('en-US',{timeZone:S.tz,hour:'numeric',hourCycle:'h23'}).format(n);
  $('#c1').innerHTML=$('#c2').innerHTML=hm+'<i>'+sc+'</i>';
  $('#d1').textContent=$('#d2').textContent=d;
  $('#cn').textContent=$('#cn2').textContent=tzName();
  $('#hi').textContent=h<5?'Boa madrugada':h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  $('#mini').textContent=hm;
  $$('[data-tz]').forEach(b=>b.textContent=fmt(b.dataset.tz,HM).format(n));
  if(S.start){const s=Math.floor((n-S.start)/1000);$('#fl').textContent=[s/3600|0,(s/60|0)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')}
  else $('#fl').textContent='--:--:--';
}
$('#fb').onclick=()=>{S.start=S.start?0:Date.now();save();$('#fb').textContent=S.start?'Pousar':'Decolar';tick()};

/* ---------- Internet ---------- */
const NET={ok:navigator.onLine,ms:0};let first=true;
function net(ok,ms){
  const was=NET.ok;NET.ok=ok;NET.ms=ms||0;
  const q=!ok?'Sem internet':ms<80?'Excelente':ms<200?'Boa':'Lenta',p=$('#net');
  p.classList.toggle('off',!ok);p.classList.toggle('slow',ok&&ms>=200);
  $('#nt').textContent=ok?'Conectado · '+ms+' ms':'Sem internet';
  $('#ms').textContent=ok?ms+' ms':'Offline';
  const c=navigator.connection;
  $('#nq').textContent=q+(ok&&c&&c.downlink?' · ↓ '+c.downlink+' Mb/s':'');
  if(!first&&was!==ok){toast(ok?'Internet de volta':'Sem conexão com a internet');if(ok)loadNews()}
  first=false;
}
async function ping(){
  if(!navigator.onLine)return net(false);
  const t=performance.now();
  try{await fetch('https://www.gstatic.com/generate_204',{mode:'no-cors',cache:'no-store'});net(true,Math.round(performance.now()-t))}
  catch{net(false)}
}
addEventListener('online',ping);addEventListener('offline',()=>net(false));
$('#wn').onclick=ping;
if(navigator.getBattery)navigator.getBattery().then(b=>{
  const u=()=>{$('#bat').hidden=false;$('#bat').textContent='Bateria '+Math.round(b.level*100)+'%'+(b.charging?' · carregando':'')};
  u();b.onlevelchange=b.onchargingchange=u;
});

/* ---------- Câmera do quarto ---------- */
let stream=null;
async function devs(){
  try{
    const l=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'),s=$('#camsel');
    s.innerHTML='';l.forEach((d,i)=>s.add(new Option(d.label||'Câmera '+(i+1),d.deviceId)));
    if(S.cam)s.value=S.cam;
  }catch{}
}
async function cam(on){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $$('video').forEach(v=>v.srcObject=null);
  if(on){
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:S.cam?{deviceId:{ideal:S.cam}}:true});
      $$('video').forEach(v=>{v.srcObject=stream;v.play()});
      devs();
    }catch{$('#cs').textContent='Não consegui abrir a câmera. Permita o acesso no navegador.';return}
  }
  document.body.classList.toggle('camon',!!stream);
  $('#cs').textContent=stream?'Câmera ligada':'Câmera desligada';
  $$('.camtog').forEach(b=>b.textContent=stream?'Desligar câmera':'Ligar câmera');
}
$$('.camtog').forEach(b=>b.onclick=()=>cam(!stream));
$('#camsel').onchange=e=>{S.cam=e.target.value;save();if(stream)cam(true)};

/* ---------- Notícias ---------- */
let news=[];
try{news=JSON.parse(localStorage.getItem('telinhas-news')||'[]')}catch{}
const demo=['Sem conexão com o feed: este é um exemplo de manchete.','Troque o feed RSS em Ajustes.','Conecte-se à internet para ver as notícias reais.'].map(t=>({title:t}));
function ago(s){
  if(!s)return'';const m=Math.round((Date.now()-new Date(s.replace(' ','T')+'Z'))/6e4);
  return m<1?'agora':m<60?'há '+m+' min':m<1440?'há '+Math.round(m/60)+' h':'há '+Math.round(m/1440)+' d';
}
function showNews(){
  const l=news.length?news:demo,box=$('#nl');box.innerHTML='';
  l.forEach(n=>{const a=document.createElement('a'),s=document.createElement('span'),m=document.createElement('small');s.textContent=n.title;m.textContent=ago(n.pubDate);a.append(s,m);if(n.link){a.href=n.link;a.target='_blank';a.rel='noopener'}box.append(a)});
  $('#tk').textContent=l.map(n=>n.title).join('   •   ');
  $('#nw').textContent=l[0].title;
}
async function loadNews(){
  $('#ns').textContent='Atualizando…';
  try{
    const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(S.rss)),j=await r.json();
    if(j.status!=='ok')throw 0;
    news=j.items.slice(0,20).map(x=>({title:x.title,link:x.link,pubDate:x.pubDate}));
    try{localStorage.setItem('telinhas-news',JSON.stringify(news))}catch{}
    $('#ns').textContent='Atualizado às '+fmt(S.tz,HM).format(new Date());
  }catch{$('#ns').textContent=news.length?'Sem conexão. Mostrando as últimas notícias salvas.':'Sem conexão com o feed. Mostrando exemplos.'}
  showNews();
}
$('#nr').onclick=loadNews;

/* ---------- Ajustes ---------- */
function apply(){
  document.body.classList.toggle('night',S.night);
  document.body.classList.toggle('warm',S.warm);
  $('#tkw').hidden=!S.ticker;
  $$('[data-s]').forEach(c=>c.checked=!!S[c.dataset.s]);
}
$$('[data-s]').forEach(c=>c.onchange=()=>{S[c.dataset.s]=c.checked;save();apply();tick()});
$('#tzs').value=S.tz;$('#rss').value=S.rss;
$('#tzs').onchange=e=>{S.tz=e.target.value;save();tick()};
$('#rss').onchange=e=>{S.rss=e.target.value.trim()||RSS0;save();loadNews()};

/* ---------- Assistente ---------- */
const log=$('#log');
function say(t,me){
  const d=document.createElement('div');d.className=me?'me':'';d.textContent=t;log.append(d);log.scrollTop=log.scrollHeight;
  if(!me&&S.voice&&window.speechSynthesis){const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';speechSynthesis.speak(u)}
}
function ask(q){
  say(q,1);
  const t=q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),has=r=>r.test(t);let a;
  if(has(/hora/))a='Agora são '+fmt(S.tz,HM).format(new Date())+' em '+tzName()+'.';
  else if(has(/\bdata\b|que dia/))a='Hoje é '+fmt(S.tz,{dateStyle:'full'}).format(new Date())+'.';
  else if(has(/internet|conexao|wifi|wi-fi/))a=NET.ok?'Você está conectado, com '+NET.ms+' ms de resposta.':'Estou sem internet agora.';
  else if(has(/bateria/))a=$('#bat').hidden?'Este dispositivo não informa a bateria.':$('#bat').textContent+'.';
  else if(has(/camera/)){const off=has(/desl|apag|fech/);cam(!off);if(!off)go(2);a=off?'Câmera desligada.':'Ligando a câmera do quarto.'}
  else if(has(/notici/)){go(4);a=(news.length?news:demo).slice(0,3).map(n=>n.title).join('. ')}
  else if(has(/tela cheia/)){fs();a='Alternando a tela cheia.'}
  else if(has(/noite/)){S.night=!S.night;save();apply();a=S.night?'Modo noite ligado.':'Modo noite desligado.'}
  else if(has(/decol/)){S.start=Date.now();save();$('#fb').textContent='Pousar';a='Decolagem registrada. Bom voo!'}
  else if(has(/pous/)){S.start=0;save();$('#fb').textContent='Decolar';a='Pouso registrado.'}
  else if(has(/inicio|home/)){go(0);a='Voltando ao início.'}
  else if(has(/relogio/)){go(1);a='Abrindo o relógio.'}
  else if(has(/ajuste|config/)){go(5);a='Abrindo os ajustes.'}
  else if(has(/ajuda|o que voce faz/))a='Posso dizer a hora e a data, ligar ou desligar a câmera, ler as notícias, testar a internet, alternar o modo noite, registrar decolagem e pouso, e trocar de tela.';
  else a='Ainda não sei fazer isso. Diga "ajuda" para ver o que eu faço.';
  say(a);
}
['Que horas são?','Como está a internet?','Notícias','Ligar câmera','Ajuda'].forEach(c=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>ask(c);$('#chips').append(b)});
$('#ask').onsubmit=e=>{e.preventDefault();const v=$('#q').value.trim();if(v){ask(v);$('#q').value=''}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('#mic').onclick=()=>{
  if(!SR)return say('Este navegador não tem reconhecimento de voz. Digite o comando.');
  const r=new SR();r.lang='pt-BR';r.onresult=e=>ask(e.results[0][0].transcript);r.start();
};

/* ---------- Início ---------- */
say('Olá! Eu sou a assistente do Telinhas. Diga "ajuda" para ver o que eu faço.');
$('#fb').textContent=S.start?'Pousar':'Decolar';
apply();tick();setInterval(tick,500);
showNews();loadNews();setInterval(loadNews,6e5);
ping();setInterval(ping,15000);go(0);
</script>
</body>
